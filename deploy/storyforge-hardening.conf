# Managed by StoryForge install.sh
# Bac à sable du service StoryForge (installé dans /etc/systemd/system/storyforge.service.d/).
# Même si une faille était exploitée dans l'application, elle ne pourrait ni devenir root,
# ni modifier le système (/usr, /etc, /boot), ni toucher au noyau.
[Service]
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=full
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectHostname=true
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
