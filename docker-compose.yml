services:
  storyforge:
    build: .
    container_name: storyforge
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data          # vidéos de fond, musique, rendus, base SQLite
      - ./secrets:/app/secrets    # google_client_secret.json
    ports:
      - "8080:8080"               # Mini App (si WEBAPP_ENABLED=true)
